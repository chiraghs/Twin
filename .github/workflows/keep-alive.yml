name: Keep Render Service Awake

# Render's free plan sleeps a service after 15 min without traffic. GitHub runs scheduled workflows
# late or not at all when they are frequent (a */10 schedule ran only every 8-15 h), so one run stays
# up and pings every 5 min for ~5 h 45 min, then starts the next run itself. The schedule is only a
# backup that restarts the chain if it ever breaks.
#
# Budget: Render gives 750 free instance hours a month across all services. Only the website is kept
# awake (the backend wakes when the website syncs with it while people use the site), and pings pause
# 09:00-11:00 UTC (night in the US), so the website uses at most ~22 h a day = 682 h in a 31-day month.
on:
  schedule:
    - cron: "17 */3 * * *"
  workflow_dispatch:

permissions:
  actions: write
  contents: read

# One pinger at a time: a scheduled run that fires while one is active waits instead of doubling up.
concurrency:
  group: keep-alive
  cancel-in-progress: false

jobs:
  ping-render:
    name: Ping the website
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - name: Ping every 5 minutes
        run: |
          URL="https://twin-web-8onw.onrender.com/"
          END=$(( $(date +%s) + 345 * 60 ))
          while [ "$(date +%s)" -lt "$END" ]; do
            HOUR=$(date -u +%H)
            if [ "$HOUR" = "09" ] || [ "$HOUR" = "10" ]; then
              echo "$(date -u +%H:%M:%S) quiet hours (09-11 UTC): letting it sleep"
            else
              out=$(curl -s -o /dev/null -w "%{http_code} %{time_total}s" --max-time 90 "$URL" || echo "failed")
              echo "$(date -u +%H:%M:%S) $URL -> $out"
            fi
            sleep 300
          done

      - name: Start the next run
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run keep-alive.yml --repo "${{ github.repository }}" --ref "${{ github.ref_name }}"
